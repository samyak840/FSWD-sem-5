<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Educational Details</title>
</head>

<body>

    <h1>Student Registration</h1>
    <h2>Educational Details</h2>

    <form action="#" method="post">

        <label for="school">Previous School / College:</label>
        <input type="text" id="school" name="school" required>

        <br><br>

        <label for="qualification">Highest Qualification:</label>

        <select id="qualification" name="qualification" required>
            <option value="">-- Select Qualification --</option>
            <option value="10th">10th / SSC</option>
            <option value="12th">12th / Intermediate</option>
            <option value="Diploma">Diploma</option>
            <option value="Bachelor">Bachelor's Degree</option>
            <option value="Master">Master's Degree</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <label for="course">Course / Program:</label>
        <input type="text" id="course" name="course" required>

        <br><br>

        <label for="branch">Branch / Specialization:</label>
        <input type="text" id="branch" name="branch">

        <br><br>

        <label for="passingYear">Year of Passing:</label>
        <input type="number" id="passingYear" name="passingYear">

        <br><br>

        <label for="percentage">Percentage / CGPA:</label>
        <input type="text" id="percentage" name="percentage">

        <br><br>

        <label for="admissionYear">Admission Year:</label>
        <input type="number" id="admissionYear" name="admissionYear" required>

        <br><br>

        <label for="studentId">Student ID / Roll Number:</label>
        <input type="text" id="studentId" name="studentId">

        <br><br>

        <label for="additionalInfo">
            Additional Educational Information:
        </label>
        <br>

        <textarea id="additionalInfo"
                  name="additionalInfo"
                  rows="4"
                  cols="40"></textarea>

        <br><br>

        <a href="Personal_Details.html">← Back</a>

        <br><br>

        <input type="submit" value="Submit Registration">

    </form>

</body>

</html>
